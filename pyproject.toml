[project]
name = "fluxo-caixa"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["holidays", "pydantic", "numpy", "pandas"]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=engine --cov-fail-under=85"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-ignore = ["C408"]
